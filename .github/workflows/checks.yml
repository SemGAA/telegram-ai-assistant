name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://assistant:test-password@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: docker build -t telegram-assistant:test .
      - run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests tests
      - if: always()
        run: docker compose -f compose.test.yaml down
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test deploy/ai-worker.test.mjs
