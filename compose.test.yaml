name: telegram-assistant-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assistant_test
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: test-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: runtime
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: assistant_test
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: test-password
    command: ["alembic", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://assistant:test-password@db:5432/assistant_test
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully

